<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAPI 1.0</title>
</head>
<body>

  <h1>DAPI 1.0</h1>

  <div>
    <input type="text" id="userInput" placeholder="输入用户说的话……" size="40">
    <button id="sendButton">send</button>
  </div>

  <div id="resultBox" style="margin-top:1.5rem;"></div>

  <script>
    (function() {
      const inputField = document.getElementById('userInput');
      const sendBtn = document.getElementById('sendButton');
      const resultBox = document.getElementById('resultBox');

      function handleSend() {
        const rawInput = inputField.value.trim();

        if (rawInput === '') {
          resultBox.textContent = '';
          return;
        }

        const jsonPath = 'program/chat/' + encodeURIComponent(rawInput) + '.json';

        fetch(jsonPath)
          .then(function(response) {
            if (!response.ok) {
              throw new Error('HTTP ' + response.status);
            }
            return response.json();
          })
          .then(function(data) {
            if (!data || typeof data !== 'object' || !('chat' in data)) {
              throw new Error('格式错误');
            }
            resultBox.textContent = data.chat;
          })
          .catch(function() {
            resultBox.textContent = rawInput;
          });
      }

      sendBtn.addEventListener('click', handleSend);

      inputField.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          handleSend();
        }
      });
    })();
  </script>

</body>
</html>
